    <script>
        let currentOrders = [];
        let filteredOrders = [];
        const itemsPerPage = 10;
        let currentPage = 1;

        // Debounced search function
        const debouncedSearch = debounce(() => {
            searchOrders();
        }, 300);

        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadOrders();
            initOrderModal();
            
            // Add event listener for search input
            document.getElementById('searchOrder').addEventListener('input', debouncedSearch);
        });

        function searchOrders() {
            const searchTerm = document.getElementById('searchOrder').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;
            
            filteredOrders = currentOrders.filter(order => {
                const matchesSearch = !searchTerm || 
                    order.id.toString().includes(searchTerm) ||
                    order.customer?.name?.toLowerCase().includes(searchTerm) ||
                    order.customer?.email?.toLowerCase().includes(searchTerm);
                
                const matchesStatus = !statusFilter || order.status === statusFilter;
                
                const matchesDate = !dateFilter || 
                    new Date(order.orderDate).toISOString().split('T')[0] === dateFilter;
                
                return matchesSearch && matchesStatus && matchesDate;
            });
            
            currentPage = 1;
            renderOrdersPaginated();
        }

        function filterOrders() {
            searchOrders();
        }

        function clearFilters() {
            document.getElementById('searchOrder').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('dateFilter').value = '';
            filteredOrders = [...currentOrders];
            currentPage = 1;
            renderOrdersPaginated();
        }

        function renderOrdersPaginated() {
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageOrders = filteredOrders.slice(startIndex, endIndex);
            
            renderOrders(pageOrders);
            updatePagination();
            updateOrdersCount();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredOrders.length / itemsPerPage);
            const paginationElement = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                paginationElement.innerHTML = '';
                return;
            }
            
            let paginationHTML = '';
            
            // Previous button
            paginationHTML += `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Previous</a>
                </li>
            `;
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    paginationHTML += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                        </li>
                    `;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    paginationHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }
            
            // Next button
            paginationHTML += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Next</a>
                </li>
            `;
            
            paginationElement.innerHTML = paginationHTML;
        }

        function changePage(page) {
            currentPage = page;
            renderOrdersPaginated();
        }

        function updateOrdersCount() {
            const countElement = document.getElementById('ordersCount');
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, filteredOrders.length);
            countElement.textContent = `${start}-${end} of ${filteredOrders.length}`;
        }

        // Update loadOrders function
        async function loadOrders() {
            try {
                const orders = await fetch('http://localhost:8081/order/all')
                    .then(response => response.json());
                
                currentOrders = orders;
                filteredOrders = [...orders];
                renderOrdersPaginated();
            } catch (error) {
                console.error('Error loading orders:', error);
                showNotification('Failed to load orders', 'danger');
            }
        }

        // Update viewOrderDetails function
        async function viewOrderDetails(orderId) {
            try {
                const order = await fetch(`http://localhost:8081/order/${orderId}`)
                    .then(response => response.json());
                
                const modalContent = document.getElementById('orderDetailsContent');
                modalContent.innerHTML = `
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h6>Customer Information</h6>
                                    <p><strong>Name:</strong> ${order.customer?.name || 'N/A'}</p>
                                    <p><strong>Email:</strong> ${order.customer?.email || 'N/A'}</p>
                                    <p><strong>Address:</strong> ${order.customer?.address || 'N/A'}</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h6>Order Information</h6>
                                    <p><strong>Order ID:</strong> #${order.id}</p>
                                    <p><strong>Order Date:</strong> ${formatDate(order.orderDate)}</p>
                                    <p><strong>Status:</strong> 
                                        <span class="badge bg-${getStatusColor(order.status)}">
                                            ${getStatusText(order.status)}
                                        </span>
                                    </p>
                                    <p><strong>Total Price:</strong> $${(order.totalPrice || 0).toFixed(2)}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <h5>Order Items</h5>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Quantity</th>
                                    <th>Unit Price</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="orderItemsDetails">
                                <!-- Items will be populated here -->
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" class="text-end"><strong>Grand Total:</strong></td>
                                    <td><strong>$${(order.totalPrice || 0).toFixed(2)}</strong></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
                
                // Load order items
                const itemsBody = document.getElementById('orderItemsDetails');
                if (order.items && order.items.length > 0) {
                    order.items.forEach(item => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${item.product?.name || 'N/A'}</td>
                            <td>${item.quantity || 0}</td>
                            <td>$${((item.price || 0) / (item.quantity || 1)).toFixed(2)}</td>
                            <td>$${(item.price || 0).toFixed(2)}</td>
                        `;
                        itemsBody.appendChild(row);
                    });
                } else {
                    itemsBody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center text-muted">No items found</td>
                        </tr>
                    `;
                }
                
                const modal = new bootstrap.Modal(document.getElementById('orderDetailsModal'));
                modal.show();
            } catch (error) {
                console.error('Error viewing order details:', error);
                showNotification('Failed to load order details', 'danger');
            }
        }

        function updateOrderStatusPrompt(orderId) {
            document.getElementById('updateOrderId').value = orderId;
            const modal = new bootstrap.Modal(document.getElementById('updateStatusModal'));
            modal.show();
        }

        async function confirmUpdateStatus() {
            const orderId = document.getElementById('updateOrderId').value;
            const status = document.getElementById('orderStatusSelect').value;
            
            try {
                const response = await fetch(`http://localhost:8081/order/update-status/${orderId}?status=${status}`, {
                    method: 'PUT'
                });
                
                if (response.ok) {
                    await loadOrders();
                    showNotification('Order status updated successfully!', 'success');
                    
                    const modal = bootstrap.Modal.getInstance(document.getElementById('updateStatusModal'));
                    modal.hide();
                } else {
                    throw new Error('Failed to update status');
                }
            } catch (error) {
                console.error('Error updating order status:', error);
                showNotification('Failed to update order status', 'danger');
            }
        }
    </script>
